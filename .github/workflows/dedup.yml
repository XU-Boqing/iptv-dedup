name: Daily dedup update

on:
  schedule:
    - cron: '30 20 * * *'  # UTC 20:30 = 北京时间每日 04:30（CCSH 04:00 更新后半小时）
  workflow_dispatch: {}    # 支持手动触发

permissions:
  contents: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download latest CCSH live_lite.m3u
        run: |
          curl -fsSL --retry 3 -o live_lite.m3u \
            "https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live_lite.m3u"

      - name: Run dedup (probe resolution, keep highest per channel)
        shell: pwsh
        run: ./dedup.ps1

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_lite.m3u live_lite_dedup.m3u
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "auto: dedup update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
